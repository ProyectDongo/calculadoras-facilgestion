{% load humanize %}
<div data-resultado='{"modo":"{{ r.modo }}","monto":{% if r.modo == "neto_a_bruto" %}{{ r.neto }}{% else %}{{ r.bruto }}{% endif %},"neto":{{ r.neto }},"iva":{{ r.iva }},"bruto":{{ r.bruto }}}'>
  <div class="space-y-3">
    <div class="flex justify-between items-baseline border-b border-slate-200 pb-2">
      <span class="text-sm text-brand-light">Monto Neto</span>
      <span class="text-lg font-semibold text-brand-dark">${{ r.neto|floatformat:0|intcomma }}</span>
    </div>
    <div class="flex justify-between items-baseline border-b border-slate-200 pb-2">
      <span class="text-sm text-brand-light">IVA <span class="text-xs">(19%)</span></span>
      <span class="text-lg font-semibold text-brand-dark">${{ r.iva|floatformat:0|intcomma }}</span>
    </div>
    <div class="flex justify-between items-baseline bg-brand/5 -mx-2 px-3 py-3 rounded-lg">
      <span class="text-sm font-medium text-brand">Total con IVA</span>
      <span class="text-2xl font-bold text-brand">${{ r.bruto|floatformat:0|intcomma }}</span>
    </div>
  </div>
</div>
