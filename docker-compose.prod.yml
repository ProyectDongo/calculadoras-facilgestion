# calculadoras.facilgestion.cl — producción.
#
# Diferencias clave vs dev:
#   - read_only: true en web (tmpfs /tmp para WeasyPrint scratch)
#   - Sin volumen del código fuente (imagen sellada)
#   - Redis y Postgres con password fuerte (.env)
#   - Memory limits estrictos
#   - logging json-driver, max-size/file
#   - Puerto host 8002 (8000 ERP, 8001 mail-facilgestion)
#
# Cloudflare Tunnel apunta a 127.0.0.1:8002 (corre como servicio externo).

services:
  web:
    image: calculadoras-facilgestion:prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calc_web
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    read_only: true
    tmpfs:
      - /tmp:size=64M,uid=10001,gid=10001
    volumes:
      - static_volume:/app/staticfiles:ro
    # Puerto 8002 — ver comentario superior
    ports:
      - "127.0.0.1:8002:8000"
    # Migrate al arranque (idempotente). Después gunicorn.
    # OJO: forma de lista (JSON-style) para evitar que el YAML folded scalar
    # rompa el quoting y gunicorn caiga a sus defaults (127.0.0.1:8000, 1 worker).
    # `exec` reemplaza al sh como PID 1 → SIGTERM llega a gunicorn limpio.
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --graceful-timeout 30 --access-logfile - --error-logfile -"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: calc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_volume:/var/lib/postgresql/data
    # NO exponemos puerto al host en prod: solo accesible desde la red docker interna.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: calc_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save ""
      --appendonly no
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  static_volume:
  db_volume:
