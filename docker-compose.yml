# calculadoras.facilgestion.cl — desarrollo local.
#
# Arquitectura:
#   web    → gunicorn + Django (con DB Postgres para captura de leads)
#   db     → Postgres dedicado, NO compartido con el ERP
#   redis  → solo para rate limiting ephemeral (TTLs cortos)
#
# Cloudflare Tunnel se corre EXTERNO al compose. En dev se expone localhost:8000.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: calculadoras-facilgestion:dev
    container_name: calc_web
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "127.0.0.1:8000:8000"
    # En dev queremos hot-reload con el código del host
    volumes:
      - .:/app:rw
      - static_volume:/app/staticfiles
    # Override del CMD del Dockerfile para usar runserver con autoreload.
    # Migrate primero para que las migrations corran al inicio.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz/',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: calc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calculadoras}
      POSTGRES_USER: ${POSTGRES_USER:-calculadoras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly_change_in_prod}
    volumes:
      - db_volume:/var/lib/postgresql/data
    # En dev expongo 127.0.0.1:5433 para inspección con psql, sin chocar con el ERP (5432).
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calculadoras} -d ${POSTGRES_DB:-calculadoras}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: calc_redis
    restart: unless-stopped
    # Sin password en dev (red interna docker). En prod sí.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  static_volume:
  db_volume:
